name: OpenGPT Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: linux
            os: ubuntu-latest
            ext: tar.gz
          - name: linux-arm64
            target: linux
            os: ubuntu-24.04-arm
            ext: tar.gz
          - name: windows-x86_64
            target: windows
            os: windows-latest
            ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies for linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronize Python environment
        run: uv sync --frozen

      - name: Build Flet App
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != [0-9]* ]]; then
            VERSION="0.0.0" # Fallback-Versionsnummer für manuelle Test-Builds ohne Tag
          fi

          uv run flet build ${{ matrix.target }} \
            --project opengpt \
            --product 'OpenGPT' \
            --artifact opengpt \
            --build-version "$VERSION" \
            --include assets \
            --include resources \
            --exclude dist \
            --exclude build \
            --exclude .git \
            --exclude .venv \
            --exclude __pycache__ \
            --exclude .env \
            --exclude '.env.*' \
            --output "dist/flet-${{ matrix.name }}" \
            --yes .

      - name: Create build archive
        shell: bash
        run: |
          ARCHIVE_NAME="opengpt-${{ matrix.name }}-${{ github.ref_name }}.${{ matrix.ext }}"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -czvf "$ARCHIVE_NAME" -C "dist/flet-${{ matrix.name }}" .
          else
            7z a "$ARCHIVE_NAME" "./dist/flet-${{ matrix.name }}/*"
          fi

      - name: Upload as test artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengpt-${{ matrix.name }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 7

      - name: Add to Github Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
