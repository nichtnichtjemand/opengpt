[project]
name = "opengpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Zollner", email = "alex.zollner2011@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "restrictedpython>=9.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
opengpt = "opengpt:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
